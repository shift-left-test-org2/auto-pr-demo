name: "Frogbot Auto-PR"
on:
  workflow_dispatch:
    inputs:
      component-name:
        description: "Dependency to fix."
        required: true
      affected-version:
        description: "Currently installed vulnerable version."
        required: true
      fix-version:
        description: "Version to upgrade to."
        required: true
      branch-name:
        description: "Branch to base the fix PR on. Defaults to the repository default branch."
        required: false
      commit-hash:
        description: "Exact commit the scan ran against."
        required: false
  repository_dispatch:
    types: [jfrog-auto-pr]
permissions:
  pull-requests: write
  contents: write
jobs:
  auto-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit-hash || github.event.client_payload.commit-hash || github.event.inputs.branch-name || github.event.client_payload.branch-name || github.event.repository.default_branch }}

      - uses: jfrog/frogbot@v3
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: auto-pr
          component-name: ${{ github.event.inputs.component-name || github.event.client_payload.component-name }}
          affected-version: ${{ github.event.inputs.affected-version || github.event.client_payload.affected-version }}
          fix-version: ${{ github.event.inputs.fix-version || github.event.client_payload.fix-version }}
          branch-name: ${{ github.event.inputs.branch-name || github.event.client_payload.branch-name || github.event.repository.default_branch }}
          commit-hash: ${{ github.event.inputs.commit-hash || github.event.client_payload.commit-hash }}
